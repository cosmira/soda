extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: true
swap:
  utilize: use
  utilizes: uses
  utilizing: using
  utilization: use
  commence: start
  commencing: starting
  prior to: before
  subsequent to: after
  in order to: to
  in the event that: if
  due to the fact that: because
  a number of: several
tests:
  - name: replace formal wording
    input: Utilize the configuration in order to commence the check.
    contains:
      - Laravel.PlainWords
      - "'Utilize'"
      - "'in order to'"
      - "'commence'"
  - name: direct wording
    input: Use the configuration to start the check.
    want: ''
  - name: code terms retain their spelling
    input: 'Call `utilize()` before the check.'
    want: ''
