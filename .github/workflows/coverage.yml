name: Coverage

on: [push, pull_request]

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: "1.0-dev"

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Generate coverage report
        run: composer test -- --coverage-clover=coverage.xml --coverage-html=coverage-html --coverage-text --colors=never
      - name: Save coverage report
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage-html
          if-no-files-found: error
      - name: Add coverage summary
        if: always() && hashFiles('coverage.xml') != ''
        run: |
          php <<'PHP' >> "$GITHUB_STEP_SUMMARY"
          <?php
          $xml = simplexml_load_file('coverage.xml');
          if ($xml === false || !isset($xml->project->metrics)) {
              fwrite(STDERR, "Unable to read coverage metrics\n");
              exit(1);
          }
          $metrics = $xml->project->metrics;
          $statements = (int) $metrics['statements'];
          $covered = (int) $metrics['coveredstatements'];
          if ($statements <= 0) {
              fwrite(STDERR, "Invalid statement count in coverage.xml\n");
              exit(1);
          }
          printf("## Code Coverage\n\nStatements: **%.2f%%** (%d/%d)\n\nDownload the `coverage-report` artifact and open `coverage-html/index.html` for details.\n", $covered * 100 / $statements, $covered, $statements);
          PHP
