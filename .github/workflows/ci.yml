name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: "1.0-dev"

jobs:
  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3.19", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
      - name: Install dependencies
        id: dependencies
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Check generated rule parser
        if: always() && steps.dependencies.outcome == 'success'
        run: |
          composer rules:compile
          git diff --exit-code -- resources/rules.php
      - name: Check formatting
        if: always() && steps.dependencies.outcome == 'success' && matrix.php == '8.3.19'
        run: composer pint:test
      - name: Static analysis
        if: always() && steps.dependencies.outcome == 'success' && matrix.php == '8.3.19'
        run: composer phpstan
      - name: Check refactorings
        if: always() && steps.dependencies.outcome == 'success' && matrix.php == '8.3.19'
        run: composer rector:check
      - name: Quality gate
        if: always() && steps.dependencies.outcome == 'success' && matrix.php == '8.3.19'
        run: composer quality
      - name: Tests
        if: always() && steps.dependencies.outcome == 'success'
        run: composer test -- --coverage-clover=coverage.xml
      - name: Performance budgets
        if: always() && steps.dependencies.outcome == 'success'
        run: composer test:performance
      - name: Upload coverage
        if: always() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
