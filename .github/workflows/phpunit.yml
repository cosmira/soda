name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: "1.2-dev"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [prefer-lowest, prefer-stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        id: php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mbstring, dom, fileinfo
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.dependencies }}-${{ hashFiles('composer.json') }}

      - name: Install matrix dependencies
        run: composer update --${{ matrix.dependencies }} --prefer-dist --no-interaction --no-progress

      - name: Validate PSR-4 autoloading
        run: composer dump-autoload --optimize --strict-psr

      - name: Run PHPUnit
        run: composer test -- --no-coverage --order-by=random --display-warnings --fail-on-warning --log-junit build/phpunit.xml

      - name: Performance budgets
        run: composer test:performance -- --no-coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-linux-php${{ matrix.php }}-${{ matrix.dependencies }}
          path: build/phpunit.xml
          if-no-files-found: warn

  windows:
    name: Windows / PHP 8.4
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        id: php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-8.4-prefer-stable-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Validate PSR-4 autoloading
        run: composer dump-autoload --optimize --strict-psr

      - name: Run PHPUnit
        run: composer test -- --no-coverage --order-by=random --display-warnings --fail-on-warning --log-junit build/phpunit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-windows-php8.4
          path: build/phpunit.xml
          if-no-files-found: warn
