name: Tests

on: [push, pull_request]

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: "1.0-dev"

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3.18', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        id: dependencies
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: Tests
        run: composer test -- --no-coverage
      - name: Performance budgets
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: composer test:performance -- --no-coverage
